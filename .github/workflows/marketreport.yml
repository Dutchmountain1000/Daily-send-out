name: Daily European Market Report

on:
  schedule:
    # Runs Monday through Friday at 16:45 UTC (18:45 CET)
    - cron: '45 16 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  run-european-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib yfinance requests

      - name: Run Market Report Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python eurostoxx50.py
          